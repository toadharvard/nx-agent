name: host
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sh tools/sync_data.sh --check
      - run: pip install -e './host[mcp,dev]'
      - run: ruff check host/src host/tests
      - run: python -m pytest -q host/tests
      - if: runner.os == 'macOS'
        run: brew install libmtp
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmtp-dev
      - run: make -C host/src/nxagent/data/native OUT="$RUNNER_TEMP" CFLAGS=-Werror
